[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantlab"
version = "0.1.0"
description = "Same model, FP16 vs INT8 vs AWQ (and FP8 where supported): measured quality, latency and VRAM trade-offs for LLM serving"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Noman Jafar", email = "numanjafarshahzad@gmail.com" }]
dependencies = ["httpx>=0.27", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]
plots = ["matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
